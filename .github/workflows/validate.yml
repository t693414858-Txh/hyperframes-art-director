name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_repo.py
      - run: python3 -m unittest discover -s tests -v
      - run: >-
          python3
          skills/art-direct-hyperframes/scripts/validate_asset_readiness.py
          examples/asset-readiness.pass.json
      - run: >-
          python3
          skills/art-direct-hyperframes/scripts/validate_direction.py
          examples/direction-brief.pass.json
      - run: >-
          python3
          skills/art-direct-hyperframes/scripts/validate_review.py
          examples/review-scorecard.pass.json
      - run: >-
          python3
          skills/art-direct-hyperframes/scripts/validate_content_rhythm.py
          examples/content-rhythm.pass.json
      - run: >-
          python3
          skills/art-direct-hyperframes/scripts/validate_shortform_retention.py
          examples/shortform-retention.pass.json
      - run: >-
          python3
          skills/art-direct-hyperframes/scripts/validate_experience_interaction.py
          examples/experience-interaction-qa.pass.json
      - run: >-
          python3
          skills/art-direct-hyperframes/scripts/prepare_visual_review.py
          examples/review-capture-plan.pass.json
          --validate-only
